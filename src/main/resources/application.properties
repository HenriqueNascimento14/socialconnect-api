# ====================================================
# SocialConnect API - Configuração de Desenvolvimento
# ====================================================

# Nome da aplicação
spring.application.name=socialconnect-api

# Porta do servidor
server.port=8080

# ===========================================================
# Banco de Dados (H2 em memória para desenvolvimento rápido)
# ===========================================================
spring.datasource.url=jdbc:h2:mem:socialconnectdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ==========================================
# JPA / Hibernate
# ==========================================
# Dialeto detectado automaticamente pelo Hibernate (H2 em dev, PostgreSQL em prod/testes de integração)

# O Flyway controla as versões do esquema do banco.
# O Hibernate apenas valida se as Entities batem com as tabelas.
spring.jpa.hibernate.ddl-auto=validate

# Exibe as queries SQL no console (útil para aprendizado)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ==========================================================
# Flyway (Migrations)
# ==========================================================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# =========================================================
# Console H2 (Acesso via navegador para inspecionar dados)
# =========================================================
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ==========================================
# SpringDoc OpenAPI / Swagger UI
# ==========================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha
springdoc.info.title=SocialConnect API
springdoc.info.description=API RESTful de gestão para instituições sociais (ITE005)
springdoc.info.version=0.0.1-SNAPSHOT
